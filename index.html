<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <style>
      /* Reset minimal */
      body {
        font-family: 'Inter', sans-serif;
        background: #f5f6f8;
        margin: 0;
        padding: 40px;
      }

      /* Container */
      .food-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: auto;
      }

      /* Card */
      .food-card {
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        transition: all 0.35s ease;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        cursor: pointer;
      }

      .food-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      }

      /* Image */
      .food-image {
        position: relative;
        overflow: hidden;
        height: 180px;
      }

      .food-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .food-card:hover .food-image img {
        transform: scale(1.08);
      }

      /* Rating Badge */
      .rating-badge {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      }

      /* Content */
      .food-content {
        padding: 20px;
      }

      .food-content h3 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
        color: #1f2937;
      }

      .category {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 14px;
      }

      /* Meta Info */
      .food-meta {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #374151;
        font-weight: 500;
      }

      .distance {
        color: #ef4444;
      }

      .price {
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <section class="food-section">
      <div class="food-container">
        <div class="food-card">
          <div class="food-image">
            <img
              src="https://images.unsplash.com/photo-1544025162-d76694265947"
              alt="Food 1"
            />
            <div class="rating-badge">⭐ 4.9</div>
          </div>

          <div class="food-content">
            <h3>Blue Zone Center</h3>
            <p class="category">Sweets</p>

            <div class="food-meta">
              <span class="distance">📍 0.09 km</span>
              <span class="price">$$$$</span>
            </div>
          </div>
        </div>

        <div class="food-card">
          <div class="food-image">
            <img
              src="https://images.unsplash.com/photo-1550547660-d9450f859349"
              alt="Food 2"
            />
            <div class="rating-badge">⭐ 4.8</div>
          </div>

          <div class="food-content">
            <h3>McDonald's Plaza Sentral</h3>
            <p class="category">Fast Food</p>

            <div class="food-meta">
              <span class="distance">📍 0.14 km</span>
              <span class="price">$$$</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
